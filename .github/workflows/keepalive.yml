name: Supabase keep-alive

on:
  schedule:
    # Every 2 hours → INSERT one row (12 rows/day)
    - cron: '0 */2 * * *'
    # Every 2 months (1st of month) → DELETE all rows
    - cron: '0 9 1 */2 *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert heartbeat row (every 2h)
        if: github.event.schedule == '0 */2 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            --fail-with-body \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive"

      - name: Cleanup keepalive table (every 2 months)
        if: github.event.schedule == '0 9 1 */2 *'
        run: |
          curl -sS -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --fail-with-body \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=neq.00000000-0000-0000-0000-000000000000"

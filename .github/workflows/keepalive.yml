name: Supabase keep-alive

on:
  schedule:
    # Daily 08:00 UTC → INSERT one row
    - cron: '0 8 * * *'
    # Sunday 09:00 UTC → DELETE all rows
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert heartbeat row (daily)
        if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            --fail-with-body \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive"

      - name: Cleanup keepalive table (weekly)
        if: github.event.schedule == '0 9 * * 0'
        run: |
          curl -sS -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --fail-with-body \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=neq.00000000-0000-0000-0000-000000000000"

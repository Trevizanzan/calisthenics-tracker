<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>Muscle Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Tema prima del primo disegno: stesse chiavi di src/lib/aspetto.ts.
  try {
    var a = JSON.parse(localStorage.getItem('muscleup:aspetto') || 'null');
    if (a) {
      var h = document.documentElement;
      h.dataset.tema = a.tema;
      h.dataset.modo = a.modo === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro') : a.modo;
      h.style.setProperty('--scala', a.scala);
    }
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
